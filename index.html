<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piñatas Martínez</title>
    <style>
        /* Estilos generales básicos */
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .seccion-tab {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .section-header h2 {
            margin-top: 0;
            color: #ff3366;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        .btn-enviar {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s ease;
        }
        .btn-enviar:hover {
            background-color: #1ebe5d;
        }
    </style>
</head>
<body>

    <div id="personalizado" class="seccion-tab">
        <div class="pedido-box">
            <div class="section-header" style="margin-bottom: 1.5rem;">
                <h2>¿Tienes un Diseño en Mente?</h2>
                <p>Mándanos los detalles exactos y en Piñatas Martínez lo hacemos realidad</p>
            </div>
            
            <!-- CONTENEDOR SEGURO SIN FORMULARIO HTTP -->
            <div id="formPedidoPersonalizado">
                <div class="form-group">
                    <label>Tu Nombre:</label>
                    <input type="text" id="nombreCliente" placeholder="Escribe tu nombre">
                </div>
                <div class="form-group">
                    <label>¿Qué producto deseas?</label>
                    <select id="tipoProducto">
                        <option value="Piñata Personalizada">Piñata 100% Personalizada</option>
                        <option value="Arreglo de Dulces Personalizado">Arreglo con Dulces Personalizado</option>
                        <option value="Combo Piñata + Arreglo">Combo Especial (Piñata + Arreglo)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Fecha del Evento / Entrega:</label>
                    <input type="date" id="fechaEvento">
                </div>
                <div class="form-group">
                    <label>Describe tu idea, colores o diseño que deseas:</label>
                    <textarea id="descripcionIdea" rows="4" placeholder="Ej. Quiero una piñata de color rosado..."></textarea>
                </div>
                <button type="button" class="btn-enviar" onclick="enviarWhatsAppDirecto()">📲 Guardar y Enviar Pedido por WhatsApp</button>
            </div>
        </div>
    </div>

    <script>
        // FUNCIÓN DIRECTA SIN BLOQUEO DE FORMULARIOS
        function enviarWhatsAppDirecto() {
            let nombre = document.getElementById('nombreCliente').value.trim();
            let producto = document.getElementById('tipoProducto').value;
            let fecha = document.getElementById('fechaEvento').value;
            let descripcion = document.getElementById('descripcionIdea').value.trim();

            if (!nombre || !fecha || !descripcion) {
                alert("Por favor completa todos los campos antes de enviar tu pedido.");
                return;
            }

            let telefono = "50494009624";
            let mensaje = `¡Hola, Piñatas Martínez! 🌟\n\nMi nombre es *${nombre}*.\nQuisiera encargar lo siguiente:\n\n• *Producto:* ${producto}\n• *Fecha de evento/entrega:* ${fecha}\n• *Detalles/Idea:* ${descripcion}`;

            let url = `https://api.whatsapp.com/send?phone=${telefono}&text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }
    </script>

</body>
</html>
